<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- animated background layers -->
  <div class="aurora">
    <span class="orb orb--1"></span>
    <span class="orb orb--2"></span>
    <span class="orb orb--3"></span>
    <div class="grid"></div>
  </div>

  <!-- floating particles -->
  <div class="particles" aria-hidden="true">
    <span style="--x: 8%;  --d: 14s; --s: 5px;  --delay: 0s;"></span>
    <span style="--x: 18%; --d: 19s; --s: 3px;  --delay: -4s;"></span>
    <span style="--x: 29%; --d: 16s; --s: 6px;  --delay: -9s;"></span>
    <span style="--x: 41%; --d: 22s; --s: 4px;  --delay: -2s;"></span>
    <span style="--x: 52%; --d: 15s; --s: 3px;  --delay: -12s;"></span>
    <span style="--x: 63%; --d: 20s; --s: 5px;  --delay: -6s;"></span>
    <span style="--x: 74%; --d: 17s; --s: 4px;  --delay: -15s;"></span>
    <span style="--x: 84%; --d: 23s; --s: 6px;  --delay: -3s;"></span>
    <span style="--x: 93%; --d: 13s; --s: 3px;  --delay: -8s;"></span>
  </div>

  <main class="stage">
    <section class="card">
      <div class="card__glow"></div>

      <header class="card__head">
        <div class="logo">
          <span class="logo__mark">
            <span></span><span></span><span></span>
          </span>
          <span class="logo__name">Aurora</span>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to continue to your workspace.</p>
      </header>

      <form class="form" autocomplete="on">
        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email" />
          <label for="email">Email address</label>
          <span class="field__line"></span>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password" />
          <label for="password">Password</label>
          <span class="field__line"></span>
        </div>

        <div class="form__row">
          <label class="check">
            <input type="checkbox" name="remember" />
            <span class="check__box"></span>
            Remember me
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button class="btn" type="submit">
          <span>Sign in</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h13M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="socials">
        <button type="button" class="social" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1A6.2 6.2 0 0 1 5.8 12 6.2 6.2 0 0 1 12 5.8c1.8 0 3 .7 3.7 1.3l2.5-2.4C16.6 3.2 14.5 2.3 12 2.3a9.7 9.7 0 1 0 0 19.4c5.6 0 9.3-3.9 9.3-9.4 0-.6-.06-1.1-.15-1.6H12z"/>
          </svg>
        </button>
        <button type="button" class="social" aria-label="Continue with GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.1.39-2 1.03-2.7-.1-.25-.45-1.28.1-2.67 0 0 .84-.27 2.75 1.03A9.5 9.5 0 0 1 12 6.8c.85 0 1.71.12 2.51.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.39.2 2.42.1 2.67.64.7 1.03 1.6 1.03 2.7 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/>
          </svg>
        </button>
        <button type="button" class="social" aria-label="Continue with Apple">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M16.1 12.9c-.02-2.2 1.8-3.27 1.88-3.32-1.02-1.5-2.62-1.7-3.19-1.73-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.18-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.74 2.21 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.71.71 2.88.69 1.19-.02 1.94-1.08 2.67-2.14.84-1.22 1.19-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.55zM14.1 6.4c.61-.74 1.02-1.76.9-2.78-.87.04-1.94.59-2.57 1.32-.56.65-1.06 1.7-.93 2.69.98.08 1.98-.5 2.6-1.23z"/>
          </svg>
        </button>
      </div>

      <p class="card__foot">New here? <a class="link" href="#">Create an account</a></p>
    </section>
  </main>
</body>
</html>
